<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Chat App</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --brand: #4a69bd;
      --brand-strong: #3b528f;
      --text: #1f2937;
      --subtext: #6b7280;
      --bubble-self: #4a69bd;
      --bubble-other: #ffffff;
      --system-bg: #fff3cd;
      --system-text: #856404;
      --border: #e5e7eb;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #111827;
      --brand: #7c3aed;
      --brand-strong: #6d28d9;
      --text: #e5e7eb;
      --subtext: #9ca3af;
      --bubble-self: #7c3aed;
      --bubble-other: #1f2937;
      --system-bg: #2f2f2f;
      --system-text: #facc15;
      --border: #2b3440;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      min-height: 100vh;
      display: grid; place-items: center;
    }
    #chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: var(--card);
      border-radius: 18px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    header {
      background: linear-gradient(135deg, var(--brand), var(--brand-strong));
      color: #fff;
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h2 { margin: 0; font-size: 18px; }
    .toggle {
      background: rgba(255,255,255,.15);
      border: none; color: #fff;
      padding: 8px 12px; border-radius: 10px; cursor: pointer;
      font-weight: 600;
    }
    #user-info {
      display: flex; gap: 10px; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      background: transparent;
    }
    #nickname {
      flex: 1; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 10px; background: transparent; color: var(--text);
    }
    #current-room-display {
      padding: 8px 12px; border-radius: 999px; background: #e9ecef;
      color: #111827; font-weight: 700; font-size: 12px;
    }
    [data-theme="dark"] #current-room-display { background: #1f2937; color: #e5e7eb; }

    .help-text {
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      font-size: 12px; color: var(--subtext); text-align: center;
    }

    #messages {
      list-style: none; margin: 0; padding: 16px; overflow-y: auto; position: relative;
      background: transparent;
    }
    /* فاصل التاريخ */
    .date-sep {
      text-align: center; margin: 16px 0; color: var(--subtext); font-size: 12px;
    }

    /* فقاعات */
    #messages li {
      max-width: 78%; margin-bottom: 12px; position: relative;
      padding: 10px 12px 18px 12px; border-radius: 14px; word-wrap: break-word; line-height: 1.45;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
      border: 1px solid var(--border);
    }
    #messages li strong { display: block; font-size: 12px; opacity: .8; margin-bottom: 4px; }
    #messages li .time {
      position: absolute; bottom: 6px; right: 10px; font-size: 10px; opacity: .7;
    }

    /* النظام */
    #messages li.system-message {
      background: var(--system-bg); color: var(--system-text);
      text-align: center; max-width: 100%; box-shadow: none; border: none;
      padding: 8px 12px; border-radius: 10px;
    }

    /* أنا */
    #messages li.self {
      margin-left: auto;
      background: var(--bubble-self); color: #fff; border-color: transparent;
    }
    #messages li.self strong { opacity: .9; }
    #messages li.self::after {
      content: ""; position: absolute; right: -6px; bottom: 10px;
      border: 8px solid transparent; border-left-color: var(--bubble-self);
    }

    /* الآخرين */
    #messages li.other {
      margin-right: auto;
      background: var(--bubble-other); color: var(--text);
    }
    #messages li.other::before {
      content: ""; position: absolute; left: -6px; bottom: 10px;
      border: 8px solid transparent; border-right-color: var(--bubble-other);
    }

    /* مؤشر الكتابة */
    #typing {
      padding: 4px 12px; color: var(--subtext); font-size: 12px; min-height: 18px;
    }

    #message-form {
      display: flex; gap: 10px; padding: 12px; border-top: 1px solid var(--border);
      background: transparent;
    }
    #message {
      flex: 1; padding: 12px; border: 1px solid var(--border);
      border-radius: 12px; background: transparent; color: var(--text);
    }
    #send {
      padding: 12px 18px; background: var(--brand); color: #fff; border: none;
      border-radius: 12px; cursor: pointer; font-weight: 700; transition: .2s;
    }
    #send:hover { background: var(--brand-strong); }
  </style>
</head>
<body>
  <div id="chat-container">
    <header>
      <h2>💬 Socket.IO Chat</h2>
      <button class="toggle" id="theme-toggle">🌙 Dark</button>
    </header>

    <div id="user-info">
      <input id="nickname" placeholder="Enter your nickname" />
      <span id="current-room-display">Room: general</span>
    </div>

    <div class="help-text">
      <strong>Commands:</strong> /join roomname | /leave | /rooms
    </div>

    <ul id="messages"></ul>
    <div id="typing"></div>

    <div id="message-form">
      <input id="message" placeholder="Type a message..." />
      <button id="send">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/main.js"></script>
</body>
</html>
